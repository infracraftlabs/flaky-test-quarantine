name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail {0}
jobs:
  # The required check: stable tests only. Quarantined tests never block a merge.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -m "not quarantine"

  # Runs on every change, reports, cannot fail the workflow run.
  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Quarantined tests (exit 5 = none left)
        run: pytest -m quarantine || [ $? -eq 5 ]
      # Runs even when the quarantined tests fail (their usual state), or the limit is never checked.
      - name: Quarantine stays small
        if: ${{ !cancelled() }}
        run: |
          n=$(pytest -m quarantine --collect-only -q | grep -c '::' || true)
          echo "$n quarantined tests"
          [ "$n" -le 10 ]

  # For comparison only: what a blanket retry does to the same flaky test.
  retries-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest --reruns 2
